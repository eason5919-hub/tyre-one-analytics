name: Publish tyre dashboard

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/tyre-dashboard-pages.yml
  workflow_dispatch:
  repository_dispatch:
    types: [tyre_dashboard_refresh]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare dashboard
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # Pages can briefly miss a newly uploaded artifact.
      - name: Wait for Pages artifact visibility
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
